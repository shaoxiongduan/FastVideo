# The FastH3 engine shape for the livestream app.
#
# Split in two on purpose: `inference` is what the checkpoint is asked for
# (clip geometry, sparse-attention kernels, compile policy) and `runtime` is
# how this deployment hosts it (GPU count, sharding, offload). The app's own
# settings -- chat, presets, sink, web -- come from the environment instead;
# see livestream/config.py.

inference:
  # The canvas every clip is generated at. 16:9 resolves to 1344x768.
  aspect: "16:9"
  # The longest clip this checkpoint can make (345 frames at 24 fps). One
  # length everywhere means one compiled shape.
  clip_seconds: 14.375
  # Built clips held in host memory awaiting playout; each holds a full
  # decoded clip, so this is also the memory budget.
  queue_size: 10
  # Requests accepted but not yet built.
  generation_queue_size: 20
  seed: 1000
  # Sigma-grid POINTS, not transformer forwards: the distilled schedule is
  # five points and exactly four forwards.
  num_inference_steps: 5

  vsa_sparsity: 0.9
  vsa_tile_size: 64
  # sm100a is the Blackwell VSA kernel; `triton` is the ~2.5x slower fallback.
  vsa_kernel: sm100a
  fa4: true
  h3_fusions: true
  inference_torch_compile: true
  compile_vae: true
  ulysses_a2a: "off"

  # Shapes warmed before the stream reports ready. "default" warms only
  # clip_seconds; "all" warms every legal length (slower start, no stall on a
  # viewer's first odd-length clip).
  warmup_aspects: ["16:9"]
  warmup_lengths: "default"

runtime:
  # Relative to the weights root (LIVESTREAM_WEIGHTS_PATH); "." means the
  # snapshot's components sit directly under it.
  checkpoint_dir: "."
  num_gpus: 4
  # Replicate the transformer on each GPU rather than FSDP-sharding it: at
  # four GB200s the weights fit, and replication skips the all-gather.
  replicated_dit: true
  offload_text_encoder: false
  offload_vae: false
  pin_cpu_memory: false
