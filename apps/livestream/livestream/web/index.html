<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>FastH3 · infinite livestream</title>
<link rel="icon" href="/assets/icon.svg">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  /* Dreamverse's palette: slate on near-white, FastVideo blue as the accent. */
  :root{
    --bg:#f5f4f4; --panel:#ffffff; --panel-2:#f8fafc; --line:#e2e8f0;
    --text:#0f172a; --dim:#64748b; --accent:#356cff; --err:#ef4444;
    --radius:12px; --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.04);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  header{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px;
         background:var(--panel);border-bottom:1px solid var(--line)}
  header img{height:26px;display:block}
  .sep{width:1px;height:20px;background:var(--line)}
  .brand{font-size:14.5px;font-weight:700;letter-spacing:-.15px;white-space:nowrap}
  .brand .fast{color:var(--accent)}
  .brand .dotsep{color:#cbd5e1;font-weight:400;margin:0 2px}
  .brand .sub{color:var(--dim);font-weight:500}
  .live{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:11px;
        font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);
        background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:4px 11px}
  .dot{width:7px;height:7px;border-radius:50%;background:#cbd5e1}
  .dot.on{background:var(--err);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 372px;
          gap:18px;padding:18px}
  .stage{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
  .video-wrap{position:relative;background:#0b1220;border:1px solid var(--line);
              border-radius:var(--radius);overflow:hidden;aspect-ratio:7/4;
              flex:0 1 auto;min-height:0;box-shadow:var(--shadow)}
  video{width:100%;height:100%;max-width:100%;display:block;background:#0b1220;object-fit:contain}
  .nowplaying{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
              padding:14px 16px;flex:1 1 auto;min-height:0;overflow:hidden;
              display:flex;flex-direction:column;box-shadow:var(--shadow)}
  /* flex:none on both: `.nowplaying` is a column flex container, so with a
     full queue below them these two shrink to fit and the title's box ends up
     shorter than its own line box -- which clips the descenders off the last
     visible line. They are fixed-size content; only the queue below should
     absorb the pressure. */
  .nowplaying h2{margin:0 0 6px;font-size:15.5px;font-weight:650;letter-spacing:-.1px;line-height:1.4;
                 flex:none;
                 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .nowplaying .meta{color:var(--dim);font-size:12.5px;flex:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:var(--shadow)}
  .card > h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);
             font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);
             font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .card .scroll{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;
                display:flex;flex-direction:column;gap:7px}
  .queuebar{margin-top:12px;border-top:1px solid var(--line);
            display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
  .queuebar.collapsed{flex:0 0 auto;margin-top:8px}
  .queuebar > h3{padding:9px 0 6px;border-bottom:0;font-size:11px;font-weight:700;
                 text-transform:uppercase;letter-spacing:.7px;color:var(--dim);
                 display:flex;justify-content:space-between;align-items:center;margin:0}
  .queuebar.collapsed > h3{padding:5px 0 0}
  .queuebar.collapsed .scroll{display:none}
  .queuebar.collapsed .chev{transform:rotate(-90deg)}
  .queuebar .scroll{flex:1;min-height:0;overflow-y:auto;padding:3px 0 4px;
                    display:flex;flex-direction:column;gap:7px}
  .side{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
  #chat{flex:1 1 auto;min-height:0}
  #queue-head{cursor:pointer;user-select:none}
  .chev{transition:transform .15s;color:#94a3b8}
  .item{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .item .top{display:flex;gap:8px;align-items:baseline;font-size:12.5px}
  .item .title{flex:1;min-width:0;font-weight:600;overflow:hidden;
               text-overflow:ellipsis;white-space:nowrap}
  .item .prompt{color:var(--dim);font-size:12px;margin-top:2px;
                overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{font-size:9.5px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);
        color:var(--dim);white-space:nowrap;flex:0 0 auto;font-weight:700;
        text-transform:uppercase;letter-spacing:.4px;background:var(--panel)}
  .pill.building{border-color:#c7d7ff;color:var(--accent);background:#eef3ff}
  .pill.ready{border-color:#bbf7d0;color:#15803d;background:#f0fdf4}
  .item:first-child .pill.ready{border-color:#c7d7ff;color:var(--accent);background:#eef3ff}
  .msg{font-size:13.5px;word-wrap:break-word;line-height:1.5}
  .msg .who{font-weight:700;color:var(--accent)}
  .msg.filler .who{color:#94a3b8;font-weight:650}
  .msg.filler{color:var(--dim)}
  .msg.system{color:var(--dim);font-style:italic}
  .msg.error{color:var(--err)}
  form{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-top:1px solid var(--line);
       background:var(--panel-2)}
  input,button{font:inherit;border-radius:9px;border:1px solid var(--line)}
  button:disabled{opacity:.55;cursor:default;box-shadow:none}
  input:disabled{opacity:.6}
  input{min-width:0;background:var(--panel);color:var(--text);padding:9px 11px}
  input::placeholder{color:#94a3b8}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  #who{flex:1 1 88px}
  #text{flex:3 1 150px}
  button{background:var(--accent);color:#fff;font-weight:650;padding:9px 17px;
         border-color:transparent;cursor:pointer;box-shadow:0 1px 2px rgba(53,108,255,.3)}
  button:hover{filter:brightness(1.06)}
  .empty{color:#94a3b8;font-size:12.5px;padding:8px 4px}
  #unmute{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
          background:var(--accent);color:#fff;font-weight:700;padding:9px 17px;
          border:0;border-radius:99px;cursor:pointer;z-index:5}
  #debug{position:fixed;right:10px;bottom:10px;z-index:20;background:#0f172af2;
         border-radius:8px;padding:8px 11px;font:11px/1.5 ui-monospace,monospace;
         color:#93c5fd;pointer-events:none;max-width:46ch}
  @media (max-width:900px){
    /* >=16px stops iOS/Chrome auto-zooming the page on focus. */
    input, #text, #who, button{font-size:16px}
    .layout{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);
            padding:10px;gap:10px}
    header{padding:8px 12px;gap:10px}
    header img{height:22px}
    .brand{font-size:12.5px}
    .brand .sub{font-size:12px}
    .video-wrap{max-height:34dvh}
    .queuebar .scroll{max-height:24dvh;flex:0 1 auto}
  }
</style>
</head>
<body>
<header>
  <img src="/assets/logo.svg" alt="FastVideo">
  <div class="sep"></div>
  <div class="brand"><span class="fast">Fast</span>H3 <span class="dotsep">·</span> <span class="sub">infinite livestream</span></div>
  <div class="live"><span class="dot" id="dot"></span><span id="livetext">connecting</span></div>
</header>

<div id="debug" hidden></div>
<div class="layout">
  <div class="stage">
    <div class="video-wrap"><video id="video" controls autoplay playsinline></video>
      <button id="unmute" hidden>&#128266; Tap for sound</button></div>
    <div class="nowplaying">
      <h2 id="np-title">Nothing playing yet</h2>
      <div class="meta" id="np-meta">The stream holds on black between clips.</div>
      <div id="queue" class="queuebar collapsed">
        <h3 id="queue-head">
          <span>Queue <span class="pill" id="queue-count">0</span></span>
          <span class="chev" id="queue-chev">&#9662;</span>
        </h3>
        <div class="scroll" id="queue-list"><div class="empty">Queue is empty.</div></div>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="card" id="chat">
      <h3>Chat</h3>
      <div class="scroll" id="chat-list"><div class="empty">Type an idea to put it on the stream.</div></div>
      <form id="chat-form">
        <input id="who" maxlength="32" placeholder="name" autocomplete="off">
        <input id="text" maxlength="800" placeholder="say what to generate…" autocomplete="off" required>
        <button type="submit">Send</button>
      </form>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------- video
// The stream arrives as HLS written by sink.py. Safari plays a playlist
// natively; everything else needs hls.js. A live playlist can 404 for the few
// seconds before ffmpeg writes its first segment, and it can go stale across an
// ffmpeg restart, so both paths simply retry rather than surfacing an error.
const PLAYLIST = "/hls/stream.m3u8";
const video = document.getElementById("video");

function startPlayback() {
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = PLAYLIST;
    video.addEventListener("error", () => setTimeout(startPlayback, 3000));
    return;
  }
  if (!window.Hls || !Hls.isSupported()) return;
  const hls = new Hls({ liveSyncDurationCount: 3, lowLatencyMode: true });
  window._hls = hls;
  // Track the playing fragment ourselves. `hls.playingDate` computes the same
  // thing, but it is a single getter that can come back null; deriving it from
  // the fragment the player reports leaves a second, independent source.
  hls.on(Hls.Events.FRAG_CHANGED, (_e, data) => {
    const frag = data && data.frag;
    if (frag && frag.programDateTime) {
      fragPDT = frag.programDateTime / 1000;
      fragStart = frag.start;
    }
  });
  hls.on(Hls.Events.ERROR, (_e, data) => {
    if (!data.fatal) return;
    hls.destroy();
    setTimeout(startPlayback, 3000);
  });
  hls.loadSource(PLAYLIST);
  hls.attachMedia(video);
}
startPlayback();

// Ask for sound; fall back to muted only if the browser refuses, and say so.
const unmute = document.getElementById("unmute");
async function tryUnmuted() {
  video.muted = false;
  try {
    await video.play();
    unmute.hidden = true;
  } catch (_) {
    video.muted = true;
    try { await video.play(); } catch (__) {}
    unmute.hidden = false;
  }
}
video.addEventListener("loadedmetadata", tryUnmuted, { once: true });
unmute.addEventListener("click", tryUnmuted);

// Which wall-clock moment is on screen.
//
// EXT-X-PROGRAM-DATE-TIME in the playlist is stamped by the same clock the
// server keys its timeline to, so this is directly comparable -- there is no
// offset to measure, smooth or subtract back out. An earlier version did
// measure one, which was both unnecessary and slightly wrong: it compared a
// freshly-read playback position against the *previous* snapshot's timestamp,
// so the error sawtoothed with the snapshot interval.
let fragPDT = null, fragStart = null;
screenTime.source = "none";

// --- the derived position, for browsers that expose no date at all ---------
// The playlist is fetched here rather than taken from the state socket: the
// socket pushes on change, so its copy of the live edge can be seconds stale,
// and staleness in one of the two staircases is what the averaging cannot fix.
const OFFSET_WINDOW_MS = 12000;   // must span more than one segment
const OFFSET_SMOOTHING = 0.2;
const OFFSET_RESET_S = 4.0;       // a jump this large means a seek or a stall
let liveEdge = null;
let offsetSamples = [];
let heldOffset = null;

async function pollLiveEdge() {
  try {
    const text = await (await fetch(PLAYLIST, { cache: "no-store" })).text();
    let pdt = null, dur = 0;
    for (const line of text.split("\n")) {
      if (line.startsWith("#EXT-X-PROGRAM-DATE-TIME:")) pdt = Date.parse(line.slice(25).trim()) / 1000;
      else if (line.startsWith("#EXTINF:")) dur = parseFloat(line.slice(8));
    }
    if (pdt) liveEdge = pdt + dur;
  } catch (_) { /* a missed poll just means one fewer sample */ }
}
setInterval(pollLiveEdge, 2000);
pollLiveEdge();

function sampleOffset() {
  if (liveEdge == null || !video.buffered.length || !(video.currentTime > 0)) return;
  const value = liveEdge - video.buffered.end(video.buffered.length - 1);
  const now = performance.now();
  // A seek, a stall or a rebuffer moves the true offset; start over rather
  // than average across the discontinuity.
  if (heldOffset != null && Math.abs(value - heldOffset) > OFFSET_RESET_S) {
    offsetSamples = [];
    heldOffset = null;
  }
  offsetSamples.push({ at: now, value });
  offsetSamples = offsetSamples.filter((x) => now - x.at <= OFFSET_WINDOW_MS);
  if (offsetSamples.length < 8 || now - offsetSamples[0].at < OFFSET_WINDOW_MS * 0.5) return;
  const mean = offsetSamples.reduce((a, x) => a + x.value, 0) / offsetSamples.length;
  heldOffset = heldOffset == null ? mean : heldOffset + OFFSET_SMOOTHING * (mean - heldOffset);
}

function screenTime() {
  const hls = window._hls;
  if (hls && hls.playingDate) {
    screenTime.source = "playingDate";
    return hls.playingDate.getTime() / 1000;
  }
  if (fragPDT != null && video.currentTime > 0) {
    screenTime.source = "fragment";
    return fragPDT + (video.currentTime - fragStart);
  }
  // Safari plays HLS natively, without hls.js; getStartDate() is its PDT.
  if (typeof video.getStartDate === "function" && video.currentTime > 0) {
    const start = video.getStartDate();
    if (start && !isNaN(start.getTime())) {
      screenTime.source = "startDate";
      return start.getTime() / 1000 + video.currentTime;
    }
  }
  // No date from the player at all -- some browsers expose none of the three.
  // Derived instead: the playlist says where the live edge is, the video says
  // how far behind its own buffer edge it is playing, and the difference is
  // the answer.
  //
  // Both of those are staircases that step about a segment apart in time, so
  // their difference is a square wave of roughly a segment's amplitude. Using
  // it directly made the title flip back and forth whenever the true position
  // sat near a clip boundary. currentTime is smooth and advances at exactly
  // 1 s/s, so the offset is averaged over more than a segment and carried on
  // currentTime, which turns a square wave into a straight line.
  if (heldOffset != null && video.currentTime > 0) {
    screenTime.source = "buffer-edge";
    return video.currentTime + heldOffset;
  }
  screenTime.source = "none";
  return null;
}

// Used only when nothing above can say where the viewer is. Falling through to
// the live clip would be the worst possible answer -- that is the one the
// engine just started, a whole pipeline ahead of the picture -- so step back
// from the newest entry by roughly the pipeline's depth instead. Expressed in
// the timeline's own units, so it needs no client clock.
const NOMINAL_LAG_S = 8.0;

// The timeline entry covering the moment on screen.
function playingNow(state) {
  if (!state.timeline || !state.timeline.length) return state.now_playing;
  let at = screenTime();
  if (at == null) at = state.timeline[state.timeline.length - 1].at - NOMINAL_LAG_S;
  let current = null, found = false;
  for (const entry of state.timeline) {
    if (entry.at <= at) { current = entry.clip; found = true; } else break;
  }
  // Behind everything we remember: show the oldest we know rather than the
  // live clip, which is certainly not what is on screen.
  if (!found) return state.timeline[0].clip;
  return current;
}

// ---------------------------------------------------------------- state
const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Requests can be 800 characters; everywhere they are shown inline they get
// the same short form, so the panel under the video reads like a chat line.
function short(text, n) {
  const t = String(text || "").trim().replace(/\s+/g, " ");
  if (t.length <= n) return t;
  // Cut on a word boundary where there is one nearby, so the tail is not a
  // fragment of a word, and always show that something was cut.
  const cut = t.slice(0, n);
  const space = cut.lastIndexOf(" ");
  return (space > n * 0.6 ? cut.slice(0, space) : cut).trimEnd() + "…";
}

function label(clip) {
  // clip.prompt is the raw request as typed (webapp fills it from the group
  // tag's raw_prompt); title is the upsampler's invention.
  return (clip.prompt || "").trim() || clip.title || clip.clip_id.slice(0, 8);
}

function renderQueue(state) {
  // Ordered by how soon each clip plays, which is the only order a viewer
  // reads this list in. Built clips come FIRST -- they are nearest the screen,
  // and the front of the playout queue is literally what plays next. Clips
  // still being built come after, since they are further away in time.
  //
  // Listing the generation queue first was backwards: a clip finishing its
  // build crosses from that queue into the playout queue, so it appeared to
  // jump to the bottom of the list at the exact moment it got closer to
  // playing.
  const items = [
    ...state.playout.map((c, i) => ({ ...c, status: "ready", pill: i === 0 ? "up next" : "ready" })),
    ...state.generation.map((c, i) => ({ ...c, status: i === 0 ? "building" : "queued",
                                         pill: i === 0 ? "building" : "queued" })),
  ];
  el("queue-count").textContent = items.length;
  const list = el("queue-list");
  if (!items.length) { list.innerHTML = '<div class="empty">Queue is empty.</div>'; return; }
  list.innerHTML = items.map(c => `
    <div class="item">
      <div class="top">
        <span class="title" title="${esc(c.title || "")}">${esc(short(label(c), 70))}</span>
        ${c.scenes > 1 ? `<span class="pill">${c.scene}/${c.scenes}</span>` : ""}
        <span class="pill ${c.status}">${c.pill}</span>

      </div>
      <div class="prompt" title="${esc(c.expanded)}">${c.generated ? "filler" : "by @" + esc(c.author_label || "viewer")}</div>
    </div>`).join("");
}

function renderChat(state) {
  const list = el("chat-list");
  if (!state.chat.length) {
    list.innerHTML = '<div class="empty">Type an idea to put it on the stream.</div>';
    return;
  }
  const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
  const me = (el("who").value.trim() || "viewer");
  list.innerHTML = state.chat.map(m => {
    if (m.kind === "viewer" || m.kind === "filler") {
      return `<div class="msg ${esc(m.kind)}"><span class="who">${esc(m.author)}</span> ${esc(short(m.text, 110))}</div>`;
    }
    // An error addressed to one viewer is that viewer's business; the feed is
    // shared, so everyone else is spared it.
    if (m.kind === "error" && m.author && m.author !== me) return "";
    return `<div class="msg ${esc(m.kind)}">${esc(m.text)}</div>`;
  }).join("");
  if (atBottom) list.scrollTop = list.scrollHeight;
}

function render(state) {
  // Everything about playback follows the viewer's own position; the queue and
  // "now generating" stay live, because those are about the machine, not the
  // picture.
  const np = playingNow(state);
  el("dot").className = "dot" + (np ? " on" : "");
  el("livetext").textContent = state.connected ? (np ? "on air" : "idle") : "offline";


  if (np) {
    const who = np.generated ? "filler" : ("requested by " + (np.author_label || "viewer"));
    el("np-title").textContent = `now playing: ${short(label(np), 72)} (${who})`;
    el("np-title").title = np.title ? (np.title + " — " + (np.expanded || "")) : (np.expanded || "");
    const bits = [];
    if (np.scene && np.scenes > 1) bits.push(`scene ${np.scene}/${np.scenes}`);
    if (np.seconds) bits.push(np.seconds.toFixed(1) + "s");
    el("np-meta").textContent = bits.join(" · ");
  } else {
    el("np-title").textContent = "Nothing playing yet";
    el("np-meta").textContent = "The stream holds on black between clips.";
  }

  const s = state.stats || {};
  if (s.generation_capacity != null) {
    el("queue-count").title =
      `generation ${s.generation_queued}/${s.generation_capacity} · ` +
      `playout ${s.playout_queued}/${s.playout_capacity}`;
  }
  renderQueue(state);
  renderChat(state);
}

// One socket, reconnecting forever: the page outlives any single connection.
let lastState = null;
let lastSeq = -1;

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const socket = new WebSocket(`${proto}://${location.host}/state`);
  socket.onmessage = (e) => {
    try {
      const next = JSON.parse(e.data);
      // A stale snapshot would rewind the timeline and move the panel back a
      // clip; drop it rather than render it.
      if (typeof next.seq === "number" && next.seq <= lastSeq) return;
      if (typeof next.seq === "number") lastSeq = next.seq;
      lastState = next; render(lastState);
    } catch (_) {}
  };
  socket.onclose = () => { lastSeq = -1; el("livetext").textContent = "reconnecting"; setTimeout(connect, 2000); };
}
connect();
// Twice a second is well under a clip length and costs nothing; it is what
// makes the panel flip exactly when the video does. The offset is sampled on
// the same tick, so its window fills whether or not state is arriving.
setInterval(() => { sampleOffset(); if (lastState) render(lastState); }, 500);

// ?debug=1 shows how the panel is being synced, on screen. If the title looks
// wrong, this says which of the three position sources answered and how far
// behind live the viewer actually is.
const DEBUG = new URLSearchParams(location.search).has("debug");
if (DEBUG) {
  const box = el("debug");
  box.hidden = false;
  setInterval(() => {
    const s = lastState;
    if (!s) { box.textContent = "no state"; return; }
    const at = screenTime();
    const newest = (s.timeline && s.timeline.length) ? s.timeline[s.timeline.length - 1].at : null;
    const behind = (at != null && newest != null) ? (newest - at) : null;
    const shown = playingNow(s);
    const live = s.now_playing;
    const h = window._hls;
    const buf = video.buffered.length
      ? (video.buffered.end(video.buffered.length - 1) - video.currentTime).toFixed(1) + "s"
      : "none";
    box.innerHTML = [
      `src <b>${screenTime.source}</b>` + (at == null ? " (NO POSITION)" : ""),
      `behind live ${behind == null ? "?" : behind.toFixed(1) + "s"}   behind buf ${buf}`,
      `hls ${h ? "yes" : "no"}  pd ${h && h.playingDate ? "yes" : "no"}` +
        `  frag ${fragPDT ? "yes" : "no"}  gsd ${typeof video.getStartDate === "function" ? "yes" : "no"}`,
      `edge ${liveEdge ? "yes" : "MISSING"}  off ${heldOffset == null ? "-" : heldOffset.toFixed(2)}` +
        `  n ${offsetSamples.length}`,
      `ct ${(video.currentTime || 0).toFixed(1)}  rs ${video.readyState}` +
        `  tl ${s.timeline ? s.timeline.length : 0}`,
      `showing: ${shown ? short(label(shown), 32) : "-"}`,
      `live:    ${live ? short(label(live), 32) : "-"}`,
    ].join("<br>");
  }, 500);
}

// The queue is reference material; chat is what people use. On a narrow
// screen it starts collapsed so the video and the chat box fit one screen.
const queueCard = document.getElementById("queue");
if (!window.matchMedia("(max-width: 900px)").matches) queueCard.classList.remove("collapsed");
document.getElementById("queue-head").addEventListener("click",
  () => queueCard.classList.toggle("collapsed"));

// ---------------------------------------------------------------- chat box
// A per-browser default name. Everyone used to fall back to the literal
// "viewer", which put every anonymous viewer in one cooldown bucket -- two
// people typing meant one of them was silently rate-limited by the other.
let saved = localStorage.getItem("fasth3-name");
if (!saved) {
  saved = "viewer-" + Math.random().toString(36).slice(2, 6);
  try { localStorage.setItem("fasth3-name", saved); } catch (_) {}
}
el("who").value = saved;

// The send box locks itself while this viewer is on cooldown. Doing it here,
// rather than reporting a refusal into the chat feed, keeps one person's
// rate-limit out of everybody else's view -- the feed is shared.
const sendButton = el("chat-form").querySelector("button");
const sendLabel = sendButton.textContent;
let cooldownUntil = 0;

function refreshSendState() {
  const left = Math.ceil((cooldownUntil - Date.now()) / 1000);
  if (left > 0) {
    sendButton.disabled = true;
    el("text").disabled = true;
    sendButton.textContent = left + "s";
  } else if (sendButton.disabled) {
    sendButton.disabled = false;
    el("text").disabled = false;
    sendButton.textContent = sendLabel;
  }
}
setInterval(refreshSendState, 250);

el("chat-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (Date.now() < cooldownUntil) return;
  const author = el("who").value.trim() || "viewer";
  const text = el("text").value.trim();
  if (!text) return;
  localStorage.setItem("fasth3-name", author);
  const previous = text;
  el("text").value = "";
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ author, text }),
    });
    if (res.status === 429) {
      // Rate-limited: keep what they typed, and lock the box until it lifts.
      const body = await res.json().catch(() => ({}));
      cooldownUntil = Date.now() + (body.retry_after || 5) * 1000;
      el("text").value = previous;
      refreshSendState();
    }
  } catch (_) { /* the socket's next snapshot tells the real story */ }
});
</script>
</body>
</html>
